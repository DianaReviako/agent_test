[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (mutable defaults, etc.)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PL",  # pylint (magic values: PLR2004)
]

[tool.ruff.lint.per-file-ignores]
# Pytest asserts compare against literals by design.
"tests/**" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
